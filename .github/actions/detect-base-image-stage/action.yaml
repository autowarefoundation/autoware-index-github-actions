name: Detect base image stage
description: |
  Return the Autoware container image stage that a set of ROS packages
  needs: `core-devel-cuda` when a package in their dependency closure
  needs CUDA, `core-devel` otherwise.

  A package needs CUDA when its package.xml depends on a CUDA package of
  Autoware Core (autoware_cuda_dependency_meta, autoware_cuda_utils,
  autoware_tensorrt_common, cuda_blackboard), or when the CMakeLists.txt
  in the package directory, or a .cmake file in its cmake/ directory,
  calls find_package(CUDA|CUDAToolkit|TensorRT), enable_language(CUDA),
  check_language(CUDA), or lists CUDA in project(... LANGUAGES ...).
  CMake files in deeper directories are not read, because vendored code
  there (for example the tests of a vendored Eigen) can call
  find_package(CUDA) without the package needing it.

inputs:
  paths:
    description: Source roots to search for package.xml files, separated by spaces or newlines.
    required: true
  packages:
    description: |
      Package names to start from, separated by spaces. The closure follows
      the dependencies to other packages under `paths`. Empty means every
      package under `paths`.
    required: false
    default: ''

outputs:
  base_image_stage:
    description: '`core-devel-cuda` or `core-devel`.'
    value: ${{ steps.detect.outputs.base_image_stage }}
  reason:
    description: The package and the signal that decided the stage.
    value: ${{ steps.detect.outputs.reason }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        SOURCE_PATHS: ${{ inputs.paths }}
        PACKAGES: ${{ inputs.packages }}
        SCRIPT: ${{ github.action_path }}/detect_base_image_stage.py
      run: |
        set -euo pipefail
        result=$(python3 -I "${SCRIPT}" --paths "${SOURCE_PATHS}" --packages "${PACKAGES}")
        stage=$(jq -r .base_image_stage <<< "${result}")
        reason=$(jq -r .reason <<< "${result}")
        echo "::notice::base_image_stage=${stage} (${reason})"
        echo "base_image_stage=${stage}" >> "${GITHUB_OUTPUT}"
        echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
